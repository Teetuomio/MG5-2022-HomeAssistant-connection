name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run decoding, command and scheduling tests
        run: pytest tests --ignore=tests/ha -q

  hass-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-homeassistant-custom-component
      - name: Run Home Assistant integration tests
        run: pytest tests/ha -q
        continue-on-error: true
