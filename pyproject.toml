[project]
name = "mg5-homeassistant"
version = "0.3.1"
description = "Home Assistant integration for the 2022 MG5 Electric"
requires-python = ">=3.12"
dependencies = ["saic-ismart-client-ng==0.13.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
